aid: fincra
url: https://raw.githubusercontent.com/api-evangelist/fincra/refs/heads/main/apis.yml
name: Fincra
kind: company
description: Fincra is an African cross-border payments infrastructure provider whose
  REST API lets businesses collect, hold, convert, and disburse money across multiple
  currencies. The platform covers collections (virtual accounts and direct charges),
  payouts/disbursements to banks and mobile money, FX conversions with quotes,
  beneficiary management, and webhooks, secured with an api-key plus Bearer token.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Cross-Border
- Collections
- Payouts
- FX
- Fintech
- Africa
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
